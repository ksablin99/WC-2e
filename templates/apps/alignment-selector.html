<form autocomplete="off" onsubmit="event.preventDefault();">
  <div class="flexcol">

    <!-- Mode selection -->
    <div class="form-group stacked">
      <label class="block-header">{{ localize "D35E.AlignmentMode" }}</label>
    </div>
    <div class="flexrow" style="margin-bottom: 6px; gap: 4px;">
      <label class="checkbox" style="position: relative; flex: 1">
        <input type="radio" class="stylized" name="mode" value="axes" {{#ifeq mode "axes"}}checked{{/ifeq}}/>
        <span class="checkmark"></span>
        <span class="label-left">{{ localize "D35E.AlignmentModeAxes" }}</span>
      </label>
      <label class="checkbox" style="position: relative; flex: 1">
        <input type="radio" class="stylized" name="mode" value="unaligned" {{#ifeq mode "unaligned"}}checked{{/ifeq}}/>
        <span class="checkmark"></span>
        <span class="label-left">{{ localize "D35E.AlignmentModeUnaligned" }}</span>
      </label>
      <label class="checkbox" style="position: relative; flex: 1">
        <input type="radio" class="stylized" name="mode" value="text" {{#ifeq mode "text"}}checked{{/ifeq}}/>
        <span class="checkmark"></span>
        <span class="label-left">{{ localize "D35E.AlignmentModeText" }}</span>
      </label>
    </div>

    <!-- Axis selectors (shown when mode = axes) -->
    <div class="alignment-axes">
      <div class="form-group stacked">
        <label class="block-header">{{ localize "D35E.AlignmentAxisLawChaos" }}</label>
      </div>
      <div class="flexrow" style="margin-bottom: 6px; gap: 4px;">
        {{#each lawChaosOptions}}
        <label class="checkbox" style="position: relative; flex: 1">
          <input type="radio" class="stylized" name="lawChaos" value="{{value}}" {{#ifeq value ../lawChaos}}checked{{/ifeq}}/>
          <span class="checkmark"></span>
          <span class="label-left">{{label}}</span>
        </label>
        {{/each}}
      </div>

      <div class="form-group stacked">
        <label class="block-header">{{ localize "D35E.AlignmentAxisGoodEvil" }}</label>
      </div>
      <div class="flexrow" style="margin-bottom: 6px; gap: 4px;">
        {{#each goodEvilOptions}}
        <label class="checkbox" style="position: relative; flex: 1">
          <input type="radio" class="stylized" name="goodEvil" value="{{value}}" {{#ifeq value ../goodEvil}}checked{{/ifeq}}/>
          <span class="checkmark"></span>
          <span class="label-left">{{label}}</span>
        </label>
        {{/each}}
      </div>
    </div>

    <!-- Free-text field (shown when mode = text) -->
    <div class="alignment-text">
      <div class="form-group">
        <label>{{ localize "D35E.Alignment" }}</label>
        <div class="form-fields">
          <input type="text" name="alignmentText" value="{{alignmentText}}"
                 placeholder="{{ localize 'D35E.Alignment' }}"/>
        </div>
      </div>
    </div>

    <button type="submit" name="submit" value="1" style="margin-top: 8px">
      <i class="far fa-save"></i> {{ localize "D35E.Confirm" }}
    </button>

  </div>
</form>
