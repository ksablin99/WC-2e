<div class="D35E chat-card item-card" data-actor-id="{{actor.id}}" data-item-id="{{item.id}}" {{#if tokenId}}data-token-id="{{tokenId}}"{{/if}}>
  <header class="card-header flexrow">
    <img src="{{item.img}}" title="{{name}}" width="36" height="36"/>
    <h3 class="item-name">{{name}}</h3>
  </header>

  <div class="card-content">
    <div class="spell-failure spell-failure-boxed">
      <h3>{{localize "D35E.ArcaneSpellFailure"}}</h3>
      <div class="dice-roll attack-roll flexcol" style="padding: 2px;">
        <div class="flexrow dice-result-row">
          <div class="flexcol">
            <div class="dice-result box">
              <h4 class="box-title">{{localize "D35E.Result"}}</h4>
              <h4 class="rolled-roll dice-total spell-failure {{#unless spellFailureSuccess}}failure{{/unless}}">{{spellFailure}}</h4>
            </div>
          </div>
          {{#unless spellFailureSuccess}}
          <div class="flexcol" style="flex: 0 10px;"></div>
          <div class="flexcol">
            <div class="dice-result box">
              <h4 class="box-title">{{localize "D35E.Target"}}</h4>
              <h4 class="rolled-versus dice-total">{{spellFailureTarget}}</h4>
            </div>
          </div>
          {{/unless}}
        </div>
      </div>
    </div>
  </div>
</div>
