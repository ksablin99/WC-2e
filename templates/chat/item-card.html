<div class="D35E chat-card item-card" data-actor-id="{{actor.id}}" data-item-id="{{item.id}}" {{#if tokenId}}data-token-id="{{tokenId}}"{{/if}}>
  <header class="card-header flexrow">
    <img src="{{item.img}}" title="{{name}}" width="36" height="36"/>
    <h3 class="item-name">{{name}}</h3>
  </header>

  <div class="card-content item">
    {{{data.description.value}}}
  </div>

  <footer class="card-footer">

    {{#if data.components.material}}
    <p><strong>{{ localize "D35E.ChatReqMats" }}.</strong> {{data.materials.value}}</p>
    {{/if}}

    {{#each data.properties}}
    <span>{{{this}}}</span>
    {{/each}}
  </footer>
</div>
